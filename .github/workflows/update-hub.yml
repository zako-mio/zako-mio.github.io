name: Update hub data and deploy to Pages

on:
  schedule:
    # 03:17 UTC daily (offsets the top-of-hour load)
    - cron: '17 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [project-updated]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # pnpm 须先于 setup-node，cache: 'pnpm' 才能直接命中
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cli.py --config site.config.json --out src/data/projects.json

      - name: Validate catalog (contract gate)
        run: python3 scripts/validate_catalog.py src/data/projects.json src/data/projects.schema.json

      # E 枢纽聚合指标：采集（产物 src/data/metrics.json 为 .gitignore，CI 每次重采）
      - name: Collect E metrics
        run: python3 scripts/collect_metrics.py --write --out src/data/metrics.json

      # 门控：口径（E1–E6）＋ E4 冻结锚点比对；FAIL 即阻断部署，WARN 只留痕
      - name: Metrics gate
        run: python3 scripts/gate_metrics.py

      - run: pnpm install --frozen-lockfile

      # 图表：能力层 echarts-declarative-chart-svg 的 Node SSR 路径，构建期出双模 SVG
      # （须在 install 之后：依赖 echarts / d3-scale-chromatic 由 lockfile 提供）
      - name: Build charts (SSR -> SVG)
        run: node scripts/build_charts.mjs

      # 拓扑：能力层 cytoscape-js-graph-topology 的 headless 计算路径（⛔ 非画布渲染）
      # 同时做「自称 vs 实测」并陈与两份定义交叉校验（不符即 fail-closed）
      - name: Build topology (headless)
        run: node scripts/build_topology.mjs

      - name: Build (Next static export -> out/)
        env:
          # 页脚 release 标识；缺省时页脚不显示 build 号
          NEXT_PUBLIC_RUN_ID: ${{ github.run_id }}
        run: pnpm build

      # 门控：读真实产物，不读源码自述
      - name: Contrast gate
        run: python3 scripts/gate_contrast.py

      - name: Static smoke gate
        run: python3 scripts/smoke_static.py

      # 页面分工门控：判「每类内容唯一落点」（首页不枚举全量作品、不嵌索引控件、
      # 不复制 /stats 与 /about 的专属区块）。读 out/ 实产物，带 --selftest 负向夹具。
      - name: IA division gate
        run: python3 scripts/gate_ia_division.py

      # 主题三态 × 双模图表同步：THEME_MODES 与 CSS 显隐规则必须同步，
      # 否则新增主题档时图表会静默停在错误的一份上。
      - name: Theme states gate
        run: python3 scripts/gate_theme_states.py

      # 交互作用面（关系型判据）：悬停反馈面 ≡ 点击热区。
      # 阈值型门控（对比度/溢出/包体）结构性看不见这类缺陷，故单列一道。
      # 读 globals.css 的真实 :hover 规则集合 + 声明表 + out/ 全量产物。
      - name: Interaction surface gate
        run: python3 scripts/gate_interaction_surface.py

      # 背景显著性：背景层结构护栏（不可交互 / 不得含可聚焦件 / 熔断全局且不可绕过）
      # + 显著性报告项（⛔ 代理指标不判阈值、不接自动回写）。
      - name: Background salience gate
        run: python3 scripts/gate_background_salience.py

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v4
        with:
          path: './out'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
