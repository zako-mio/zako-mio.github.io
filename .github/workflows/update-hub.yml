name: Update hub data and deploy to Pages

on:
  schedule:
    # 03:17 UTC daily (offsets the top-of-hour load)
    - cron: '17 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [project-updated]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6

      # pnpm 须先于 setup-node，cache: 'pnpm' 才能直接命中
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'

      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 scripts/cli.py --config site.config.json --out src/data/projects.json

      - name: Validate catalog (contract gate)
        run: python3 scripts/validate_catalog.py src/data/projects.json src/data/projects.schema.json

      # E 枢纽聚合指标：采集（产物 src/data/metrics.json 为 .gitignore，CI 每次重采）
      - name: Collect E metrics
        run: python3 scripts/collect_metrics.py --write --out src/data/metrics.json

      # 门控：口径（E1–E6）＋ E4 冻结锚点比对；FAIL 即阻断部署，WARN 只留痕
      - name: Metrics gate
        run: python3 scripts/gate_metrics.py

      - run: pnpm install --frozen-lockfile

      # 图表：能力层 echarts-declarative-chart-svg 的 Node SSR 路径，构建期出双模 SVG
      # （须在 install 之后：依赖 echarts / d3-scale-chromatic 由 lockfile 提供）
      - name: Build charts (SSR -> SVG)
        run: node scripts/build_charts.mjs

      # 拓扑：能力层 cytoscape-js-graph-topology 的 headless 计算路径（⛔ 非画布渲染）
      # 同时做「自称 vs 实测」并陈与两份定义交叉校验（不符即 fail-closed）
      - name: Build topology (headless)
        run: node scripts/build_topology.mjs

      - name: Build (Next static export -> out/)
        env:
          # 页脚 release 标识；缺省时页脚不显示 build 号
          NEXT_PUBLIC_RUN_ID: ${{ github.run_id }}
        run: pnpm build

      # 门控：读真实产物，不读源码自述
      - name: Contrast gate
        run: python3 scripts/gate_contrast.py

      - name: Static smoke gate
        run: python3 scripts/smoke_static.py

      # 页面分工门控：判「每类内容唯一落点」（首页不枚举全量作品、不嵌索引控件、
      # 不复制 /stats 与 /about 的专属区块）。读 out/ 实产物，带 --selftest 负向夹具。
      - name: IA division gate
        run: python3 scripts/gate_ia_division.py

      # 主题三态 × 双模图表同步：THEME_MODES 与 CSS 显隐规则必须同步，
      # 否则新增主题档时图表会静默停在错误的一份上。
      - name: Theme states gate
        run: python3 scripts/gate_theme_states.py

      # 交互作用面（关系型判据）：悬停反馈面 ≡ 点击热区。
      # 阈值型门控（对比度/溢出/包体）结构性看不见这类缺陷，故单列一道。
      # 读 globals.css 的真实 :hover 规则集合 + 声明表 + out/ 全量产物。
      - name: Interaction surface gate
        run: python3 scripts/gate_interaction_surface.py

      # 背景显著性：背景层结构护栏（不可交互 / 不得含可聚焦件 / 熔断全局且不可绕过）
      # + 显著性报告项（⛔ 代理指标不判阈值、不接自动回写）。
      - name: Background salience gate
        run: python3 scripts/gate_background_salience.py

      # 动效预算（批十一 §4-②）：进场/常驻动效的**数量级失控守卫**（M1–M4 四项上界）。
      # 阈值由实测基线 × 声明余量推导（M2 由 motion.ts 的兜底窗口推导），带 --selftest 负向夹具。
      - name: Motion budget gate
        run: python3 scripts/gate_motion_budget.py

      # ──────────────────────────────────────────────────────────────────────
      # 浏览器层判据（第八批 §4-② 硬化）：此前全部是**提示词级**（CI 只跑 python3），
      # 现补 playwright ＋ 一次静态服务，把四条升为 **runtime 硬阻**。
      # 活件在 scripts/probes/（来源登记脚本 · scripts/probes/PROVENANCE.json）。
      # ⚠ 两条读 out/ ⇒ 必须在本步之前 build 过；hover_gating 缺 out/ 会以 rc=2 报「用法错误」。
      # ──────────────────────────────────────────────────────────────────────
      - name: Probe provenance check
        run: python3 scripts/probes/check_provenance.py

      - name: Hover-gating probe (产物 CSS 静态解析，无需浏览器)
        run: |
          python3 scripts/probes/hover_gating_probe.py --selftest
          python3 scripts/probes/hover_gating_probe.py

      - name: Cache Playwright browsers
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          # 键从依赖文件派生（⛔ 不写第二处版本字面量，避免与 requirements 漂移）
          key: playwright-${{ runner.os }}-${{ hashFiles('scripts/probes/requirements-probes.txt') }}

      - name: Install browser-layer deps (playwright + chromium + pillow)
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r scripts/probes/requirements-probes.txt
          python3 -m playwright install --with-deps chromium

      - name: Serve static export (background, port 4399)
        run: |
          nohup python3 -m http.server 4399 --directory out > "$RUNNER_TEMP/http4399.log" 2>&1 &
          for i in $(seq 1 40); do
            if curl -sf -o /dev/null http://127.0.0.1:4399/; then echo "server up"; exit 0; fi
            sleep 0.5
          done
          echo "::error::静态服务未起来"; cat "$RUNNER_TEMP/http4399.log"; exit 1

      - name: SVG layout probe (图件几何) — selftest + 实测
        env:
          SITE_BASE: http://127.0.0.1:4399
        run: |
          python3 scripts/probes/svg_layout_probe.py --selftest
          python3 scripts/probes/svg_layout_probe.py

      - name: Composite contrast probe (双主题) — selftest + 实测
        env:
          SITE_BASE: http://127.0.0.1:4399
        run: |
          python3 scripts/probes/contrast_theme_probe.py --selftest
          python3 scripts/probes/contrast_theme_probe.py

      - name: Surface-hit probe (行为口径覆盖率) — selftest + 实测
        env:
          SITE_BASE: http://127.0.0.1:4399
        run: |
          python3 scripts/probes/surface_hit_probe.py --selftest --out "$RUNNER_TEMP/surface-hit"
          python3 scripts/probes/surface_hit_probe.py --out "$RUNNER_TEMP/surface-hit"
          echo "[artifact] $RUNNER_TEMP/surface-hit/surface-hit-report.md"

      # 进场可见性 × 进入路径（第十二批 §4-①）：已有四探针各自**单页整页加载**，
      # 跨客户端路由导航这一维**无人在看** ⇒ 动效开时「切回首页/进关于页 ⇒ 内容消失」
      # 静默穿过全部八闸五探针。本探针用站内 <Link> 真点一遍，判「进入路径无关性」。
      - name: Reveal-visibility probe (进入路径无关性) — selftest + 实测
        env:
          SITE_BASE: http://127.0.0.1:4399
        run: |
          python3 scripts/probes/reveal_nav_probe.py --selftest
          python3 scripts/probes/reveal_nav_probe.py

      # Hero 交互保护（第十三批 W1）：`.hero__map` 由 `<svg>` 改为 HTML wrapper 后
      # **参与命中测试**（原为 `pointer-events: none`）⇒ 结构上多了一个可能遮挡
      # Hero 内可交互件（主 CTA / `#featured` 锚点）的大面。⛔ 不靠「预期安全」推断，
      # 用 elementFromPoint 逐目标实测（H1 命中 / H2 不叠热区 / H3 断点 / H4 可被命中）。
      - name: Hero hit-protection probe (W1 验收) — selftest + 实测
        env:
          SITE_BASE: http://127.0.0.1:4399
        run: |
          python3 scripts/probes/hero_hit_probe.py --selftest --out "$RUNNER_TEMP/hero-hit"
          python3 scripts/probes/hero_hit_probe.py --out "$RUNNER_TEMP/hero-hit"
          echo "[artifact] $RUNNER_TEMP/hero-hit/hero-hit-report.md"

      # 术语解释层（第十四批 W2）：解释性文字收敛到 `src/data/glossary.json` 单一真相源后，
      # 呈现层必须**仍然可用且不靠 JS**。⛔ 不靠「能 hover 就行」的口头保证 ——
      # T1 静止态 / T2 hover / T3 键盘 focus（WCAG 1.4.13）/ T4 Esc / T5 role+aria 关联 /
      # T6 **无 JS 可读**（直读原始 HTML，不经浏览器）六条逐条实测。
      - name: Term-layer probe (术语解释层) — selftest + 实测
        env:
          SITE_BASE: http://127.0.0.1:4399
        run: |
          python3 scripts/probes/term_layer_probe.py --selftest
          python3 scripts/probes/term_layer_probe.py

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: './out'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
