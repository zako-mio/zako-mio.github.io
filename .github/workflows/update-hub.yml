name: Update hub data and deploy to Pages

on:
  schedule:
    # 03:17 UTC daily (offsets the top-of-hour load, per REV1 §2.4)
    - cron: '17 3 * * *'
  workflow_dispatch:
  repository_dispatch:
    types: [project-updated]

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - uses: actions/setup-python@v5
        with:
          python-version-file: '.python-version'
      - name: Fetch catalog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/cli.py --config site.config.json --out src/data/projects.json
      - name: Validate catalog (contract gate)
        run: python scripts/validate_catalog.py src/data/projects.json src/data/projects.schema.json
      - run: npm ci
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: './dist'

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
